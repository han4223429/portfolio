<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my-gpt 회칙 점검 시연</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>my-gpt 회칙 점검</h1>
    <p>모델 없이 규칙만으로 도는 기능 하나를 브라우저로 옮겼습니다. 대화, 검색, 법령 답변은 로컬 모델이 있어야 해서 여기서는 돌리지 않습니다.</p>
  </header>
  <main class="cols">
    <section aria-labelledby="inTitle">
      <h2 id="inTitle">규정 문서</h2>
      <label class="sr" for="draft">점검할 회칙이나 세칙</label>
      <textarea id="draft" rows="12" spellcheck="false"></textarea>
      <div class="actions">
        <button type="button" id="run" class="primary">점검하기</button>
        <button type="button" id="sample">예시 다시 넣기</button>
        <button type="button" id="clear">비우기</button>
      </div>
    </section>
    <section aria-labelledby="outTitle">
      <h2 id="outTitle">점검 결과 <span id="count"></span></h2>
      <ol id="result" aria-live="polite"><li class="empty">‘점검하기’를 누르면 조 번호 중복과 빠짐, 문서에 없는 조 참조, 모호한 표현, 의무와 재량이 섞인 문장을 찾습니다.</li></ol>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
